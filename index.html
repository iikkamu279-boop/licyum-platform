                          </div>
                          <div className="sm:col-span-2">
                            <label className="block font-bold text-slate-700 mb-1">Judul Karya / Buku *</label>
                            <input name="title" required defaultValue="Transformasi Digital dan Tata Kelola Sekolah Unggul" className="w-full p-2.5 bg-white border border-slate-200 rounded-xl" />
                          </div>
                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Nama Pemohon</label>
                            <input name="applicant" defaultValue="Dr. Wahyu Pratama, M.Pd." className="w-full p-2.5 bg-white border border-slate-200 rounded-xl" />
                          </div>
                          <div className="sm:col-span-2">
                            <label className="block font-bold text-slate-700 mb-1">Tahapan Saat Ini *</label>
                            <input name="step" required defaultValue="Penetapan Nomor ISBN & Barcode oleh Tim Perpusnas RI" className="w-full p-2.5 bg-white border border-slate-200 rounded-xl" />
                          </div>
                          <div>
                            <label className="block font-bold text-slate-700 mb-1">Label Status</label>
                            <select name="label" className="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-bold">
                              <option value="Dalam Antrean">Dalam Antrean</option>
                              <option value="Proses Review">Proses Review</option>
                              <option value="Revisi Diperlukan">Revisi Diperlukan</option>
                              <option value="Disetujui Perpusnas">Disetujui Perpusnas</option>
                              <option value="Terbit & Final">Terbit & Final</option>
                            </select>
                          </div>
                          <div className="sm:col-span-3">
                            <label className="block font-bold text-slate-700 mb-1">Catatan Tim Redaksi</label>
                            <textarea name="notes" rows="2" defaultValue="Naskah final telah disetujui. Nomor ISBN sedang digenerate oleh Perpusnas RI." className="w-full p-2.5 bg-white border border-slate-200 rounded-xl" />
                          </div>
                          <div className="sm:col-span-3 flex justify-end">
                            <button type="submit" className="py-2.5 px-6 bg-rose-700 hover:bg-rose-800 text-white font-bold rounded-xl shadow flex items-center gap-1.5">
                              <i data-lucide="save" className="w-4 h-4"></i>
                              <span>Simpan Perubahan Tracking</span>
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  )}

                </div>

                <div className="p-4 bg-slate-100 border-t border-slate-200 flex justify-end">
                  <button onClick={() => setAdminModalOpen(false)} className="px-5 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-[#0F2850]">
                    Tutup Panel
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
